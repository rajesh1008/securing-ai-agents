[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bulwark"
version = "0.1.0"
description = "Policy-enforcement layer for AI agents, built in the book Securing AI Agents (Quill lab)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rajesh Ranjan Mahapatra" }]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "httpx>=0.27", "anthropic>=0.40", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]
labs = ["numpy>=1.26", "scikit-learn>=1.4", "jsonschema>=4", "torch>=2.4", "safetensors>=0.4"]

[project.urls]
Repository = "https://github.com/rajesh1008/securing-ai-agents"

[tool.setuptools]
packages = ["bulwark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
